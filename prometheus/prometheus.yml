global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: otel-containers
    static_configs:
      - targets: ["otel-collector:8889"]
